# Reusable workflow: build a container image and push it to the company registry (Aliyun ACR).
#
#   jobs:
#     image:
#       uses: GL-Game-Group/.github/.github/workflows/build-image.yml@main
#       with:
#         image: my-app            # repository name in ACR (default: the GitHub repo name)
#       secrets: inherit           # needs ACR_USERNAME / ACR_PASSWORD (org or repo secrets)
#
# Tags: the full commit SHA (deploy this one) and the branch name.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Image repository name in ACR (default the GitHub repository name)
        type: string
        default: ""
      context:
        type: string
        default: .
      file:
        description: Dockerfile path (default <context>/Dockerfile)
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64
      registry:
        type: string
        default: glwork-registry.cn-hongkong.cr.aliyuncs.com
      namespace:
        type: string
        default: glwork
    secrets:
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
    outputs:
      image:
        description: Pushed image reference with the commit SHA tag
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          name="${{ inputs.image }}"
          [ -n "$name" ] || name="${GITHUB_REPOSITORY#*/}"
          repo="${{ inputs.registry }}/${{ inputs.namespace }}/${name,,}"
          branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.ref.outputs.repo }}:${{ github.sha }}
            ${{ steps.ref.outputs.repo }}:${{ steps.ref.outputs.branch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Pushed \`${{ steps.ref.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
